<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body style="font-family: Arial, sans-serif; padding: 20px">
    <h2>Your Account Details</h2>
    <p>You can now receive payments using the following virtual accounts:</p>
    <table style="border-collapse: collapse; margin-top: 10px; width: 100%">
      <tr style="background-color: #f2f2f2">
        <th style="padding: 8px; text-align: left">Bank</th>
        <th style="padding: 8px; text-align: left">Account Name</th>
        <th style="padding: 8px; text-align: left">Account Number</th>
      </tr>
      {{range .Accounts}}
      <tr>
        <td style="padding: 8px; border-bottom: 1px solid #ddd">
          {{.BankName}}
        </td>
        <td style="padding: 8px; border-bottom: 1px solid #ddd">
          {{.AccountName}}
        </td>
        <td style="padding: 8px; border-bottom: 1px solid #ddd">
          {{.AccountNumber}}
        </td>
      </tr>
      {{end}}
    </table>
    <p style="margin-top: 20px; font-size: 14px; color: #555">
      Keep this information safe. You can use it to receive payments instantly.
    </p>
  </body>
</html>
