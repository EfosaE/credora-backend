type: object
required:
  - name
  - email
  - nin
  - password
  - phone_number
properties:
  name:
    type: string
    example: Jane Doe
  email:
    type: string
    format: email
    example: jane@example.com
  nin:
    type: string
    description: National Identification Number (11 digits)
    example: "12345678901"
  password:
    type: string
    format: password
  phone_number:
    type: string
    example: "+2348012345678"
