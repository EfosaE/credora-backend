type: object
required:
  - from_account
  - toAccount
  - amount
properties:
  from_account:
    type: string
    description: Source account number (NUBAN, 10 digits)
    example: "0123456789"
  toAccount:
    type: string
    description: Destination account number (NUBAN, 10 digits)
    example: "0987654321"
  amount:
    type: string
    description: Decimal amount as string to preserve precision in incoming DTO
    example: "1500.00"
