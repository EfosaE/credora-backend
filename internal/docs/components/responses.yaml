BadRequest:
  description: Bad request
  content:
    application/json:
      schema:
        $ref: './schemas/ErrorResponse.yaml'
Unauthorized:
  description: Authentication required / invalid credentials
  content:
    application/json:
      schema:
        $ref: './schemas/ErrorResponse.yaml'
InternalError:
  description: Internal server error
  content:
    application/json:
      schema:
        $ref: './schemas/ErrorResponse.yaml'
Conflict:
  description: Conflict (e.g., duplicate idempotent request)
  content:
    application/json:
      schema:
        $ref: './schemas/ErrorResponse.yaml'
