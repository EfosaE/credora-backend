internal_post:
  post:
    summary: Internal transfer between two accounts (idempotent)
    tags:
      - Operations
    security:
      - cookieAuth: []
    parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: >
          Unique key to guarantee idempotent internal transfers.
          Re-using the same key with the same payload will return the same result.
        schema:
          type: string
          example: "int-transfer-6f9a0c2e-8a4d-4e2f-bb9e-11c1e53a12d3"
      
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/InternalTransferDTO.yaml'
          examples:
            basic:
              value:
                from_account: "0123456789"
                toAccount: "0987654321"
                amount: "1500.00"
    responses:
      '200':
        description: Transfer successful
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Transfer successful
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
