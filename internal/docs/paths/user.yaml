info_get:
  get:
    summary: Get information about the authenticated user
    tags:
      - Users
    security:
      - cookieAuth: []
    responses:
      '200':
        description: User info retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/UserInfoResponse.yaml'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
