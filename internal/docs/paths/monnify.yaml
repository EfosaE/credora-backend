reserved_account_delete:
  delete:
    summary: Delete a Monnify reserved account
    tags:
      - Monnify
    parameters:
      - name: acctRef
        in: path
        required: true
        schema:
          type: string
        description: Account reference (acctRef) assigned when reserving the account
    responses:
      '200':
        description: Reserved account deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Reserved account deleted successfully
                data:
                  type: object
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
