services:
  app:
    container_name: credora-server
    image: credora-backend:v1.00 # or build: . if you have a Dockerfile in the same directory
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env
    ports:
      - "8080:8080" # change to your Go app port
    networks:
      - app-network
    command: ./server # or whatever your Go binary entrypoint is
    volumes:
      - ./credora-backend-firebase-adminsdk.json:/app/firebase.json

  redis:
    container_name: redis
    image: redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-network
    volumes:
      - redis-data:/data

volumes:
  redis-data:


networks:
  app-network:
    driver: bridge
