name: Credora CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credora-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/efosae/credora-backend

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod tidy -diff

      - name: Run unit tests
        run: make test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod tidy -diff

      - name: Run integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
        run: make test-integration

  build:
    name: Build and Publish Image
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    # Pull requests run tests but never publish or deploy.
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name != 'pull_request'

    environment: VPS-Deploy

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Debug known_hosts (temporary)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "lines: $(wc -l < ~/.ssh/known_hosts)"
          echo "fields per line:"; awk '{print NF, $2}' ~/.ssh/known_hosts
          echo "fingerprint:"; ssh-keygen -lf ~/.ssh/known_hosts || true
          echo "host lookup:"; ssh-keygen -F "$VPS_HOST" >/dev/null && echo "FOUND" || echo "NOT FOUND"

      - name: Deploy API and workers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -eu

          cd /opt/credora/backend

          IMAGE="ghcr.io/efosae/credora-backend:$IMAGE_TAG"

          echo "Pulling $IMAGE"
          docker pull "$IMAGE"

          export IMAGE_TAG

          echo "Updating API..."
          docker compose -f docker-compose.yml \
            up -d --no-deps app

          echo "Updating three workers..."
          docker compose -f docker-compose.worker.yaml \
            up -d --no-deps --scale worker=3 worker

          echo "Checking running containers..."
          docker ps

          echo "Deployment commands completed."
          REMOTE
