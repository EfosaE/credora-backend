services:
  worker:
    image: ${CREDORA_IMAGE:-ghcr.io/efosae/credora-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - app-network
    command: ./worker
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./credora-backend-firebase-adminsdk.json:/app/firebase.json

networks:
  app-network:
    external: true
    name: backend_app-network